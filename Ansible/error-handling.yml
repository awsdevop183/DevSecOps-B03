---
- name: Play for Testing Block, Rescue, Always with AWS CLI
  hosts: nodes
  gather_facts: yes
  become: yes
  tasks:
    - name: Testing The Ansible Blocks
      block:
        - name: Perform apt update
          shell: apt update
        - name: Check if Unzip Exists
          shell: unzip
        - name: Check if jq Exists
          shell: jq --help
        - name: Check if AWS Exists
          shell: aws --version
      when: ansible_distribution == 'Ubuntu' or ansible_distribution_version == '20.04'

      # Rescue tasks execute if any of the block task fails in above section.
      rescue:
        - name: Install unzip
          apt:
            name: unzip
            state: latest
        - name: Installing jq
          apt:
            name: jq
            state: latest
        - name: Installing AWS
          shell: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install

      always:
        - name: Run This Always
          shell: ls -al
          register: file_list

        - name: Print Files
          debug:
            msg: "{{file_list.stdout}}"

        - name: Check AWS CLI Version
          shell: aws --version
