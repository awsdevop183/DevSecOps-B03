services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    deploy:
      replicas: 1 # never scale a single-writer DB without shared/networked storage
      placement:
        constraints:
          - node.role == manager # pins it to one node so its volume stays on that node's disk
      restart_policy:
        condition: on-failure

  # Swarm can't build images — these must already exist in the registry
  # (see "docker build && docker push" in the README before deploying).
  backend:
    image: awsdevops183/movies-backend:v1
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      PORT: ${BACKEND_PORT}
    networks:
      - app-network
    deploy:
      replicas: 3 # stateless -> safe to run many copies
      restart_policy:
        condition: on-failure

  frontend:
    image: awsdevops183/movies-frontend:v1
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

volumes:
  mongo-data:

networks:
  app-network:
    driver: overlay # bridge only works within one host; overlay spans every node in the swarm
