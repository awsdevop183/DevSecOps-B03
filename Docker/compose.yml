services:
  # 1. Database — official Mongo image, no custom build needed
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017" # bound to localhost only — never expose the DB publicly
    volumes:
      - mongo-data:/data/db # named volume -> data survives `docker-compose down`
    networks:
      - app-network

  # 2. Backend API — built from ./backend, talks to mongodb by service name
  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"

    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. Frontend — built from ./frontend, calls the backend from the VISITOR'S BROWSER,
  #    so APP_HOST must be an address the browser can reach (not the container network)
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    environment:
      REACT_APP_API_URL: http://${APP_HOST}:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge

